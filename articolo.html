<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Notizia - Oratorio Madonna dei Poveri</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { blue: '#1E3A8A', sky: '#0284C7', amber: '#D97706', sage: '#4D7C63' } },
                    fontFamily: { heading: ['Fraunces', 'serif'], body: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Tipografia leggibile per il corpo dell'articolo, generato dal contenuto del file HTML della notizia */
        #article-body p { margin-bottom: 1.1em; line-height: 1.75; }
        #article-body h2 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.4rem; margin-top: 1.6em; margin-bottom: 0.6em; color: #0f172a; }
        #article-body ul, #article-body ol { margin: 0 0 1.1em 1.4em; }
        #article-body li { margin-bottom: 0.4em; }
        #article-body a { color: #1E3A8A; font-weight: 600; text-decoration: underline; }
        #article-body img { border-radius: 1rem; margin: 1.5em 0; max-width: 100%; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- HEADER E NAVIGAZIONE -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3 group shrink-0">
                    <img src="assets/img/logo-placeholder.svg" alt="Logo Oratorio Madonna dei Poveri" class="w-11 h-11 rounded-2xl shadow-md group-hover:scale-105 transition-transform">
                    <div>
                        <span class="block text-lg font-extrabold text-slate-900 tracking-tight font-heading leading-none">Madonna dei Poveri</span>
                        <span class="text-xs font-semibold text-brand-sky tracking-wide">Oratorio · Collegno</span>
                    </div>
                </a>
                <a href="notizie.html" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-semibold text-sm text-brand-blue bg-blue-50 hover:bg-blue-100 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Tutte le notizie
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENUTO ARTICOLO -->
    <main class="flex-1 py-14">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">

            <div id="article-loading" class="space-y-4">
                <div class="h-6 w-32 rounded skeleton-card"></div>
                <div class="h-10 w-full rounded skeleton-card"></div>
                <div class="aspect-[16/9] w-full rounded-3xl skeleton-card"></div>
                <div class="h-4 w-full rounded skeleton-card"></div>
                <div class="h-4 w-5/6 rounded skeleton-card"></div>
            </div>

            <article id="article-wrap" class="hidden">
                <div class="flex items-center gap-3 text-xs font-semibold text-slate-500 mb-4">
                    <span id="article-category" class="bg-sky-50 text-brand-sky px-2.5 py-1 rounded-full"></span>
                    <span id="article-date"></span>
                </div>
                <h1 id="article-title" class="text-3xl sm:text-4xl font-heading font-bold text-slate-900 leading-tight mb-6"></h1>
                <img id="article-image" src="" alt="" class="w-full h-auto rounded-3xl border border-slate-100 shadow-sm mb-8" onerror="this.src='assets/img/news-placeholder.svg'">
                <div id="article-body" class="text-slate-700 text-base"></div>
            </article>

            <div id="article-not-found" class="hidden text-center py-20 px-6 bg-white rounded-3xl border border-dashed border-slate-300">
                <i class="fa-regular fa-face-frown text-3xl text-slate-400 mb-3"></i>
                <p class="text-slate-600 font-medium">Notizia non trovata.</p>
                <a href="notizie.html" class="inline-block mt-4 text-brand-blue font-semibold hover:underline">Torna a tutte le notizie</a>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4">
                <p>&copy; <span id="current-year"></span> Oratorio Madonna dei Poveri - Collegno. Tutti i diritti riservati.</p>
                <a href="index.html" class="hover:text-white transition-colors">Torna alla Home</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/news.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = (params.get('id') || '').replace(/[^0-9]/g, '').padStart(3, '0');

            const loadingEl = document.getElementById('article-loading');
            const wrapEl = document.getElementById('article-wrap');
            const notFoundEl = document.getElementById('article-not-found');

            if (!id) {
                loadingEl.classList.add('hidden');
                notFoundEl.classList.remove('hidden');
                return;
            }

            const item = await fetchNewsFile(id);
            loadingEl.classList.add('hidden');

            if (!item) {
                notFoundEl.classList.remove('hidden');
                return;
            }

            document.getElementById('page-title').textContent = `${item.title} - Oratorio Madonna dei Poveri`;
            document.getElementById('article-category').textContent = item.category;
            document.getElementById('article-date').textContent = formatDateIt(item.date);
            document.getElementById('article-title').textContent = item.title;
            document.getElementById('article-image').src = item.image;
            document.getElementById('article-image').alt = item.title;
            document.getElementById('article-body').innerHTML = item.content;
            wrapEl.classList.remove('hidden');
        });
    </script>
</body>
</html>
